<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- pig_c4 = YELLOW shooter -> a round CLOWN/BAIT FISH critter. -->
  <defs>
    <radialGradient id="p4g" cx="42%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="55%" stop-color="#ffc91f"/>
      <stop offset="100%" stop-color="#d9920a"/>
    </radialGradient>
  </defs>
  <g stroke="#8a5a04" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path fill="url(#p4g)" d="M80 50 l16 -14 0 28 z"/>
    <!-- fins -->
    <path fill="url(#p4g)" d="M44 26 q6 -12 16 -10 q-4 8 -10 12 z"/>
    <path fill="url(#p4g)" d="M44 78 q6 12 16 10 q-4 -8 -10 -12 z"/>
    <!-- body -->
