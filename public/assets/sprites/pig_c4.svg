    <!-- contrast stripe to back the ammo number readability -->
    <path fill="#fff6d8" stroke="none" d="M30 30 q-14 22 0 44 q10 -22 0 -44 z" opacity="0.55"/>
    <circle cx="26" cy="46" r="6" fill="#fff"/><circle cx="25" cy="47" r="3" fill="#3a2700" stroke="none"/>
  </g>
</svg>
