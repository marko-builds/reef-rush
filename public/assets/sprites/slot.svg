<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- slot = a BAIT BUCKET frame, one seat in the tackle rack of 5. Empty/idle look;
       main.js tints it toward warm amber at 4/5 and 5/5 (lockup tension), so this art
       is authored neutral and gets a color multiply at runtime. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- bucket body (trapezoid) -->
    <path d="M22 34 L78 34 L70 86 L30 86 Z" fill="#0d3a44" fill-opacity="0.35" stroke="#bfeef6" stroke-width="5"/>
    <!-- rim -->
    <rect x="18" y="26" width="64" height="12" rx="6" fill="#0d3a44" fill-opacity="0.45" stroke="#bfeef6" stroke-width="5"/>
    <!-- handle -->
    <path d="M30 28 Q50 8 70 28" stroke="#bfeef6" stroke-width="5"/>
    <!-- water line hint -->
    <path d="M28 50 q22 8 44 0" stroke="#8fdce8" stroke-width="3" opacity="0.7"/>
  </g>
</svg>
