<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- treasure = the level-5 centerpiece: a golden PEARL in an open scallop shell.
       Original art (reef feel: warm gold + candy shine, dark friendly outline). -->
  <defs>
    <radialGradient id="tpearl" cx="42%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#fffef2"/>
      <stop offset="45%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#f0b428"/>
    </radialGradient>
    <linearGradient id="tshell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd96b"/>
      <stop offset="100%" stop-color="#d9920a"/>
    </linearGradient>
    <linearGradient id="tshellBack" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e8a81c"/>
      <stop offset="100%" stop-color="#fff0a8"/>
    </linearGradient>
  </defs>
  <g stroke="#7a4d12" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- open upper shell (fan), tilted back -->
    <path fill="url(#tshellBack)" d="M50 46
      L20 18 Q26 12 33 14 L38 9 Q44 5 50 9 L56 5 Q63 4 67 10 L74 14 Q81 13 80 21 Z"/>
    <path fill="none" stroke-width="2.5" d="M50 44 L31 17 M50 44 L44 10 M50 44 L58 8 M50 44 L72 15"/>
    <!-- the pearl -->
    <circle cx="50" cy="50" r="17" fill="url(#tpearl)"/>
    <ellipse cx="43" cy="43" rx="4.5" ry="3" fill="#ffffff" stroke="none" opacity="0.9"/>
    <!-- lower shell (cup) -->
    <path fill="url(#tshell)" d="M22 58 Q50 46 78 58 Q76 78 64 84 Q50 90 36 84 Q24 78 22 58 Z"/>
    <path fill="none" stroke-width="2.5" d="M34 62 Q40 76 44 82 M50 60 L50 86 M66 62 Q60 76 56 82"/>
    <!-- little sparkles -->
    <path fill="#fffef2" stroke="none" d="M81 36 l2.2 4.6 4.6 2.2 -4.6 2.2 -2.2 4.6 -2.2 -4.6 -4.6 -2.2 4.6 -2.2 Z"/>
    <path fill="#fffef2" stroke="none" d="M16 40 l1.6 3.4 3.4 1.6 -3.4 1.6 -1.6 3.4 -1.6 -3.4 -3.4 -1.6 3.4 -1.6 Z"/>
  </g>
</svg>
