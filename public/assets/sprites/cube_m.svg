<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- cube_m = MINE type key 'M' (Phase 4), rendered HOT RED/ORANGE — a danger
       hue distinct from coral/teal/green/gold AND from the wild jellyfish
       purple. Silhouette: a round NAVAL MINE (spiked sphere) with a glowing
       ember core, so "this one explodes" reads at a glance. -->
  <defs>
    <radialGradient id="mg" cx="42%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#ff9a5c"/>
      <stop offset="45%" stop-color="#ff4030"/>
      <stop offset="100%" stop-color="#8f1410"/>
    </radialGradient>
    <radialGradient id="mcore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c0"/>
      <stop offset="60%" stop-color="#ffb43d"/>
      <stop offset="100%" stop-color="#ff5a2a"/>
    </radialGradient>
  </defs>
  <g stroke="#5c0c08" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- spikes (8, radial) -->
    <path fill="#a31a12" d="M50 6 L56 20 L44 20 Z"/>
    <path fill="#a31a12" d="M50 94 L44 80 L56 80 Z"/>
    <path fill="#a31a12" d="M6 50 L20 44 L20 56 Z"/>
    <path fill="#a31a12" d="M94 50 L80 56 L80 44 Z"/>
    <path fill="#a31a12" d="M19 19 L33 24 L24 33 Z"/>
    <path fill="#a31a12" d="M81 19 L76 33 L67 24 Z"/>
    <path fill="#a31a12" d="M19 81 L24 67 L33 76 Z"/>
    <path fill="#a31a12" d="M81 81 L67 76 L76 67 Z"/>
    <!-- body -->
    <circle cx="50" cy="50" r="31" fill="url(#mg)"/>
    <!-- ember core -->
    <circle cx="50" cy="50" r="12" fill="url(#mcore)" stroke-width="3"/>
    <!-- glassy highlight -->
    <path fill="none" stroke="#ffd9b8" stroke-width="3.5" d="M32 36 C35 28 42 24 49 23"/>
  </g>
</svg>
