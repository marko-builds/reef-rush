  </defs>
  <circle cx="20" cy="22" r="13" fill="url(#bg)" stroke="#9c4e08" stroke-width="3"/>
  <rect x="16" y="6" width="8" height="10" rx="3" fill="#ffe39a" stroke="#9c4e08" stroke-width="2.5"/>
