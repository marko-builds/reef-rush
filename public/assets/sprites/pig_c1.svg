    <!-- eye stalks -->
    <line x1="40" y1="36" x2="38" y2="24"/><line x1="60" y1="36" x2="62" y2="24"/>
    <circle cx="38" cy="22" r="5" fill="#fff"/><circle cx="38" cy="22" r="2.2" fill="#2a0a06" stroke="none"/>
    <circle cx="62" cy="22" r="5" fill="#fff"/><circle cx="62" cy="22" r="2.2" fill="#2a0a06" stroke="none"/>
  </g>
</svg>
