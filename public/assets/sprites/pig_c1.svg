<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- pig_c1 = RED shooter -> a chubby CRAB bait critter. Ammo number sits on the body. -->
  <defs>
    <radialGradient id="p1g" cx="42%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#ff8a72"/>
      <stop offset="55%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#c41f17"/>
    </radialGradient>
  </defs>
  <g stroke="#7e120c" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- claws -->
    <path fill="url(#p1g)" d="M20 50 q-12 -4 -10 -16 q10 0 12 10 z"/>
    <path fill="url(#p1g)" d="M80 50 q12 -4 10 -16 q-10 0 -12 10 z"/>
    <!-- legs -->
