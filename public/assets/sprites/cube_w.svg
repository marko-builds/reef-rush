<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- cube_w = WILD color key 'W' (Phase 4), rendered JELLYFISH-PURPLE — a 5th hue
       distinct from coral/teal/green/gold so "any pig can shoot me" reads at a
       glance. Silhouette: a JELLYFISH (bell + trailing tentacles). -->
  <defs>
    <radialGradient id="wg" cx="50%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#dcb2ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b2bb5"/>
    </radialGradient>
  </defs>
  <g stroke="#3d1370" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- bell -->
    <path fill="url(#wg)" d="M50 16
      C28 16 14 32 14 52
      C14 58 19 62 26 61
      C32 64 40 64 46 61
      C52 64 60 64 66 61
      C73 62 86 58 86 52
      C86 32 72 16 50 16 Z"/>
    <!-- tentacles -->
    <path fill="none" stroke="#c98fff" stroke-width="4.5" d="
      M28 63 C26 72 30 76 27 84
      M40 64 C39 74 44 78 41 88
      M52 64 C52 75 48 79 51 89
      M64 63 C66 73 61 77 64 86
      M75 61 C77 70 73 74 76 82"/>
    <!-- glassy highlights -->
    <path fill="none" stroke="#efdcff" stroke-width="3.5" d="M30 34 C34 26 42 22 50 22"/>
    <circle cx="62" cy="36" r="4" fill="#efdcff" stroke="none"/>
  </g>
</svg>
