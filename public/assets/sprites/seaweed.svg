<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- seaweed = the Phase 4 WRAP overlay (spec: Seaweed-wrapped blocks). Drawn
       OVER a base color tile, so coverage is deliberately PARTIAL: two crossed
       kelp straps + a knot + small fronds, leaving the tile's own hue clearly
       readable underneath (color readability is non-negotiable). Peeled off
       with a slide-up strip animation on the first correct-color hit. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- main diagonal strap (lower-left -> upper-right) -->
    <path fill="#1f7a4d" fill-opacity="0.92" stroke="#0d4a2c" stroke-width="3"
      d="M2 78 C20 70 34 52 42 38 C50 24 62 12 78 4
         L92 14 C74 24 64 36 56 50 C48 64 32 82 12 92 Z"/>
    <!-- crossing strap (upper-left -> lower-right), slimmer -->
    <path fill="#2e9e63" fill-opacity="0.88" stroke="#0d4a2c" stroke-width="3"
      d="M6 14 C24 22 38 34 48 48 C58 62 72 74 90 80
         L84 92 C64 86 50 72 40 58 C30 44 18 32 2 26 Z"/>
    <!-- the knot where the straps cross -->
    <ellipse cx="49" cy="46" rx="9.5" ry="8" fill="#2e9e63" stroke="#0d4a2c" stroke-width="3"/>
    <ellipse cx="49" cy="44.5" rx="4.5" ry="3.5" fill="#7fd6a4" stroke="none"/>
    <!-- small loose fronds curling off the straps -->
    <path fill="none" stroke="#2e9e63" stroke-width="4.5" d="M14 86 C20 80 20 74 26 70"/>
    <path fill="none" stroke="#1f7a4d" stroke-width="4.5" d="M82 10 C78 16 80 22 74 26"/>
    <path fill="none" stroke="#2e9e63" stroke-width="4" d="M86 84 C80 82 78 76 72 74"/>
    <!-- wet highlights along the straps -->
    <path fill="none" stroke="#7fd6a4" stroke-width="2.5" stroke-opacity="0.9"
      d="M10 80 C26 70 38 54 46 40"/>
    <path fill="none" stroke="#7fd6a4" stroke-width="2.5" stroke-opacity="0.9"
      d="M12 20 C28 28 40 40 50 52"/>
  </g>
</svg>
